[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyuscope"
version = "4.7.0"
description = "Digital microscope controller"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "BSD" }
authors = [
    { name = "John McMaster", email = "john@labsmore.com" },
]
dependencies = [
    "bitarray",
    "boto3",
    "distro",
    "flask>=2.2.2",
    "flask-cors",
    "flask-socketio",
    "imageio",
    "json5",
    "matplotlib",
    "numpy",
    "opencv-python-headless",
    "paramiko",
    "pexpect",
    "piexif",
    "pillow",
    "psutil",
    "pygame",
    "pynput",
    "pyrav4l2 @ git+https://github.com/antmicro/pyrav4l2.git",
    "pyserial",
    "pyusb",
    "pyzbar",
    "requests",
    "scipy",
    "werkzeug",
]

[project.urls]
Homepage = "https://github.com/Labsmore/pyuscope"

[tool.setuptools.packages.find]
include = ["uscope*"]
namespaces = true

# Keep one lock file and one environment for the root package and any future
# packages added below it.
[tool.uv.workspace]
members = []

# Lint baseline: pyflakes class errors only (undefined names, unused
# imports/variables, syntax errors). Run with:
#   uvx ruff check
[tool.ruff]
include = ["uscope/**/*.py", "app/**/*.py", "utils/**/*.py", "test/**/*.py"]
extend-exclude = ["archive", "build", "dist", "gst-plugin-toupcam", "rhodium"]
target-version = "py38"

[tool.ruff.lint]
select = ["F", "E9"]
ignore = [
    # Qt code relies heavily on star imports
    "F403",
    "F405",
]

[tool.ruff.lint.per-file-ignores]
# Intentionally malformed script used to test the scripting error path
"uscope/script/test/test_malformed.py" = ["F821"]
